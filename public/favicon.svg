<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Outer Glow Card -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="url(#glowGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Candlestick / Growth Chart Elements -->
  <g stroke="url(#chartGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bar 1 -->
    <line x1="120" y1="360" x2="120" y2="280" stroke-width="8"/>
    <rect x="108" y="300" width="24" height="50" rx="4" fill="url(#chartGrad)"/>

    <!-- Bar 2 -->
    <line x1="200" y1="340" x2="200" y2="220" stroke-width="8"/>
    <rect x="188" y="250" width="24" height="70" rx="4" fill="url(#chartGrad)"/>

    <!-- Bar 3 -->
    <line x1="280" y1="300" x2="280" y2="160" stroke-width="8"/>
    <rect x="268" y="190" width="24" height="90" rx="4" fill="url(#chartGrad)"/>

    <!-- Trend Line Curve -->
    <path d="M 110 310 Q 210 240 380 130" fill="none" stroke="url(#chartGrad)" stroke-width="18" stroke-dasharray="0"/>
    
    <!-- Arrow Head -->
    <polygon points="380,130 350,130 380,160" fill="url(#chartGrad)"/>
  </g>

  <!-- Glowing Point -->
  <circle cx="380" cy="130" r="16" fill="#fbbf24"/>
</svg>
